<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TrafficIQ Edge AI — Real-Time Browser Traffic Vision</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B0F17">
  <link rel="manifest" href="manifest.json">

  <!-- Typography: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bgDark: '#0B0F17',
              cardDark: '#131B26',
              cyan: '#00D2FF',
              amber: '#F59E0B',
              emerald: '#10B981',
              danger: '#EF4444'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- TensorFlow.js & COCO-SSD Edge AI Model via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B0F17;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
    }
    .glass-header {
      background: rgba(11, 15, 23, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-panel {
      background: rgba(19, 27, 38, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    /* Touch Target Guarantee */
    .touch-target {
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none bg-brand-bgDark">

  <!-- ========================================================================= -->
  <!-- 1. FULLSCREEN VIDEO STREAM & OVERLAY CANVAS                              -->
  <!-- ========================================================================= -->
  <div id="videoContainer" class="relative w-full h-full overflow-hidden bg-black flex items-center justify-center">
    <!-- Camera Video Element -->
    <video id="webcam" playsinline autoplay muted class="absolute inset-0 w-full h-full object-cover"></video>

    <!-- AI Bounding Box & Tripwire Canvas -->
    <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

    <!-- Crosshair Viewfinder Loading Overlay -->
    <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-brand-bgDark/95 backdrop-blur-md z-40 transition-opacity duration-500">
      <div class="relative w-24 h-24 mb-6">
        <div class="absolute inset-0 rounded-full border-4 border-cyan-500/20 animate-ping"></div>
        <div class="absolute inset-2 rounded-full border-4 border-t-cyan-400 border-r-transparent border-b-cyan-500 border-l-transparent animate-spin"></div>
        <div class="absolute inset-0 flex items-center justify-center text-2xl">🤖</div>
      </div>
      <h2 class="text-xl font-bold font-mono tracking-wider text-cyan-400">INITIALIZING EDGE AI</h2>
      <p id="loadingStatusText" class="text-xs font-mono text-slate-400 mt-2 text-center max-w-xs px-4">
        Downloading TensorFlow.js & MobileNet COCO-SSD weights...
      </p>
      <button id="btnGrantCamManual" class="mt-6 px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs uppercase tracking-wider hidden shadow-lg shadow-cyan-500/30">
        Grant Camera Permission
      </button>
    </div>

    <!-- Low FPS Thermal Throttling Warning Banner -->
    <div id="lowFpsBanner" class="absolute top-16 inset-x-4 px-3.5 py-2 rounded-xl bg-red-600/90 border border-red-400 text-white font-mono text-xs font-bold flex items-center justify-between shadow-lg shadow-red-500/30 z-30 opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-4">
      <div class="flex items-center gap-2">
        <span class="animate-bounce">⚠️</span>
        <span>LOW FPS DETECTED (<span id="lowFpsValue">0</span> FPS) — THERMAL THROTTLING</span>
      </div>
      <span class="text-[10px] bg-black/40 px-2 py-0.5 rounded">COOL DEVICE</span>
    </div>

    <!-- Crossing Flash Indicator -->
    <div id="crossingBanner" class="absolute bottom-28 left-4 px-3 py-1.5 rounded-lg bg-emerald-500/90 text-slate-950 font-mono text-xs font-black shadow-lg shadow-emerald-500/30 opacity-0 pointer-events-none transition-opacity duration-200 z-30">
      ⚡ 1:1 INBOUND VEHICLE COUNTED
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- 2. SLEEK GLASSMORPHISM FLOATING HEADER                                    -->
  <!-- ========================================================================= -->
  <header class="absolute top-0 inset-x-0 glass-header px-4 py-2.5 flex items-center justify-between z-30">
    <!-- App Identity & Live Status -->
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-400 text-sm">
        🚦
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="font-extrabold text-sm tracking-tight text-white">TrafficIQ</span>
          <span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-cyan-500/20 text-cyan-300 font-mono border border-cyan-500/30">EDGE AI</span>
        </div>
        <div class="flex items-center gap-1.5 text-[10px] font-mono text-slate-400">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="headerCamFacingLabel">REAR CAMERA</span>
        </div>
      </div>
    </div>

    <!-- Center Metric: Inbound Vehicle Counter -->
    <div class="flex flex-col items-center">
      <div class="text-[10px] font-mono text-slate-400 uppercase tracking-widest font-semibold">INBOUND COUNT</div>
      <div id="metricTotalCount" class="text-2xl font-black font-mono tracking-tight text-cyan-400 leading-none">
        0
      </div>
    </div>

    <!-- Right Controls: FPS Pill & Lens Switcher -->
    <div class="flex items-center gap-2">
      <!-- Live FPS Pill -->
      <div id="fpsPill" class="px-2.5 py-1 rounded-full bg-slate-800/80 border border-white/10 text-emerald-400 text-xs font-mono font-bold flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="fpsCount">-- FPS</span>
      </div>

      <!-- Camera Lens Switcher Button (Min 44x44px touch target) -->
      <button id="btnSwitchCamera" class="touch-target rounded-full bg-slate-800/80 border border-white/15 hover:border-cyan-400 text-cyan-400 transition-all active:scale-95" title="Switch Front/Rear Camera">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- 3. BOTTOM FLOATING CONTROLS & MODAL BREAKDOWN DRAWER                      -->
  <!-- ========================================================================= -->
  <div class="absolute bottom-4 inset-x-4 flex flex-col gap-2 z-30">

    <!-- Vehicle Class Breakdown Tally (Bike, Car, Bus, Truck) -->
    <div class="glass-panel rounded-2xl p-2.5 grid grid-cols-4 gap-2 text-center font-mono">
      <div class="flex flex-col items-center">
        <span class="text-[10px] text-amber-400 font-bold">BIKE</span>
        <span id="countBike" class="text-base font-bold text-white leading-none mt-0.5">0</span>
      </div>
      <div class="flex flex-col items-center border-l border-white/10">
        <span class="text-[10px] text-cyan-400 font-bold">CAR</span>
        <span id="countCar" class="text-base font-bold text-white leading-none mt-0.5">0</span>
      </div>
      <div class="flex flex-col items-center border-l border-white/10">
        <span class="text-[10px] text-emerald-400 font-bold">BUS</span>
        <span id="countBus" class="text-base font-bold text-white leading-none mt-0.5">0</span>
      </div>
      <div class="flex flex-col items-center border-l border-white/10">
        <span class="text-[10px] text-red-400 font-bold">TRUCK</span>
        <span id="countTruck" class="text-base font-bold text-white leading-none mt-0.5">0</span>
      </div>
    </div>

    <!-- Quick Utilities Toolbar -->
    <div class="flex items-center justify-between gap-2">
      <!-- Flashlight / Torch Toggle -->
      <button id="btnToggleTorch" class="touch-target flex-1 rounded-xl glass-panel text-xs font-semibold text-slate-300 flex items-center justify-center gap-1.5 active:bg-slate-700/50">
        <span>🔦</span>
        <span id="torchLabel">Torch</span>
      </button>

      <!-- Tripwire Calibration Reset / Level -->
      <button id="btnResetTripwire" class="touch-target flex-1 rounded-xl glass-panel text-xs font-semibold text-amber-400 flex items-center justify-center gap-1.5 active:bg-slate-700/50">
        <span>📏</span>
        <span>Center Line</span>
      </button>

      <!-- Export CSV Report -->
      <button id="btnExportCsv" class="touch-target flex-1 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold flex items-center justify-center gap-1.5 shadow-lg shadow-cyan-500/20 active:scale-95">
        <span>📥</span>
        <span>Export CSV</span>
      </button>

      <!-- Reset Counters -->
      <button id="btnResetCounts" class="touch-target w-12 rounded-xl glass-panel text-xs text-red-400 hover:text-red-300 flex items-center justify-center active:bg-slate-700/50" title="Reset Counts">
        <span>↺</span>
      </button>
    </div>
  </div>

  <!-- Toast Notification Pill -->
  <div id="toast" class="absolute bottom-24 inset-x-6 mx-auto max-w-xs py-2 px-3.5 rounded-full bg-slate-900/90 border border-white/20 text-xs font-medium text-center text-white shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-50">
    <span id="toastText">Ready</span>
  </div>

  <!-- ========================================================================= -->
  <!-- 4. CORE APPLICATION JAVASCRIPT: WEBRTC + TENSORFLOW.JS EDGE AI             -->
  <!-- ========================================================================= -->
  <script>
    // --- Application State ---
    let model = null;
    let isModelLoading = true;
    let videoStream = null;
    let currentFacingMode = "environment"; // environment (rear) or user (front)
    let torchActive = false;
    let videoTrack = null;

    // Vehicle Telemetry Counts
    const counts = { total: 0, bike: 0, car: 0, bus: 0, truck: 0 };

    // Tripwire Horizontal Line Position (Ratio of Canvas Height: 0.55 = 55% from top)
    let tripwireRatioY = 0.55;

    // Tracked Vehicle Objects to prevent duplicate counting
    // Key: trackerId, Value: { id, prevY, currY, crossed: bool, lastSeen: timestamp }
    const trackedEntities = new Map();
    let entityIdCounter = 1;

    // FPS Measurement
    let lastTime = performance.now();
    let frameTimes = [];
    let fps = 0;
    let lowFpsCounter = 0;

    // DOM Elements
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("overlayCanvas");
    const ctx = canvas.getContext("2d");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingStatusText = document.getElementById("loadingStatusText");
    const fpsCountEl = document.getElementById("fpsCount");
    const fpsPill = document.getElementById("fpsPill");
    const lowFpsBanner = document.getElementById("lowFpsBanner");
    const lowFpsValue = document.getElementById("lowFpsValue");
    const crossingBanner = document.getElementById("crossingBanner");
    const toast = document.getElementById("toast");
    const toastText = document.getElementById("toastText");

    // Target Classes to Detect
    const VEHICLE_CLASSES = {
      'car': { label: 'CAR', color: '#00D2FF', key: 'car' },
      'truck': { label: 'TRUCK', color: '#EF4444', key: 'truck' },
      'bus': { label: 'BUS', color: '#10B981', key: 'bus' },
      'motorcycle': { label: 'MOTORCYCLE', color: '#F59E0B', key: 'bike' },
      'bicycle': { label: 'BICYCLE', color: '#F59E0B', key: 'bike' }
    };

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.remove("opacity-0", "translate-y-4");
      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-4");
      }, 2500);
    }

    // =========================================================================
    // STEP 1: INITIALIZE CAMERA VIA WEBRTC                                     //
    // =========================================================================
    async function startCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }

      loadingStatusText.textContent = `Connecting ${currentFacingMode === "environment" ? "Rear" : "Front"} Camera...`;

      // Try rear camera with fallback constraints
      const constraintsList = [
        {
          video: {
            facingMode: { exact: currentFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        },
        {
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        },
        { video: true, audio: false }
      ];

      let stream = null;
      for (const constraint of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraint);
          if (stream) break;
        } catch (err) {
          console.warn("Retrying with fallback camera constraint...", err);
        }
      }

      if (!stream) {
        loadingStatusText.textContent = "Camera access blocked. Please allow camera permissions in browser settings.";
        document.getElementById("btnGrantCamManual").classList.remove("hidden");
        return;
      }

      videoStream = stream;
      video.srcObject = stream;
      videoTrack = stream.getVideoTracks()[0];

      await new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });

      document.getElementById("headerCamFacingLabel").textContent = currentFacingMode === "environment" ? "REAR CAMERA" : "FRONT CAMERA";
      showToast(`📷 Active: ${currentFacingMode === "environment" ? "Rear Street Lens" : "Front Lens"}`);
    }

    // =========================================================================
    // STEP 2: LOAD TENSORFLOW.JS COCO-SSD MODEL                                //
    // =========================================================================
    async function loadEdgeAIModel() {
      try {
        loadingStatusText.textContent = "Loading TensorFlow.js COCO-SSD (MobileNet V2)...";
        // MobileNet V2 provides balanced speed (~20 FPS) and precision on mobile devices
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
        isModelLoading = false;

        // Hide Loading Overlay
        loadingOverlay.classList.add("opacity-0", "pointer-events-none");
        showToast("🚀 Edge AI Vision Model Active!");
      } catch (err) {
        console.error("TensorFlow.js load error:", err);
        loadingStatusText.textContent = "Failed to load model weights. Check internet connection and refresh.";
      }
    }

    // =========================================================================
    // STEP 3: RESIZE CANVAS & ALIGN RESOLUTIONS                                 //
    // =========================================================================
    function resizeCanvas() {
      if (video.videoWidth && video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      } else {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    }
    window.addEventListener("resize", resizeCanvas);

    // =========================================================================
    // STEP 4: TRIPWIRE & COLLISION ENGINE                                      //
    // =========================================================================
    function checkTripwireCrossing(bbox, classKey) {
      const [x, y, w, h] = bbox;
      const centerY = y + h / 2;
      const centerX = x + w / 2;
      const tripwireY = canvas.height * tripwireRatioY;

      // Associate detected bounding box with a tracked entity ID
      let matchedId = null;
      let minDistance = 80; // Distance threshold for frame-to-frame matching

      for (const [id, entity] of trackedEntities.entries()) {
        const dist = Math.hypot(centerX - entity.currX, centerY - entity.currY);
        if (dist < minDistance) {
          minDistance = dist;
          matchedId = id;
        }
      }

      const now = Date.now();
      let justCrossed = false;

      if (matchedId !== null) {
        const entity = trackedEntities.get(matchedId);
        entity.prevY = entity.currY;
        entity.currY = centerY;
        entity.currX = centerX;
        entity.lastSeen = now;

        // Top-to-Bottom Crossing Condition:
        // Previous position was ABOVE tripwire, Current position is AT or BELOW tripwire
        if (!entity.crossed && entity.prevY < tripwireY && entity.currY >= tripwireY) {
          entity.crossed = true;
          justCrossed = true;

          // Increment telemetry counts
          counts.total++;
          if (classKey && counts[classKey] !== undefined) {
            counts[classKey]++;
          }
          updateMetricsUI();

          // Flash indicator banner
          crossingBanner.classList.remove("opacity-0");
          setTimeout(() => crossingBanner.classList.add("opacity-0"), 400);
        }
      } else {
        // New Vehicle Entry
        const newId = entityIdCounter++;
        trackedEntities.set(newId, {
          id: newId,
          prevY: centerY,
          currY: centerY,
          currX: centerX,
          crossed: false,
          lastSeen: now
        });
      }

      // Cleanup stale tracked entities (> 2000ms inactive)
      for (const [id, entity] of trackedEntities.entries()) {
        if (now - entity.lastSeen > 2000) {
          trackedEntities.delete(id);
        }
      }

      return justCrossed;
    }

    function updateMetricsUI() {
      document.getElementById("metricTotalCount").textContent = counts.total;
      document.getElementById("countBike").textContent = counts.bike;
      document.getElementById("countCar").textContent = counts.car;
      document.getElementById("countBus").textContent = counts.bus;
      document.getElementById("countTruck").textContent = counts.truck;
    }

    // =========================================================================
    // STEP 5: INFERENCE LOOP & CANVAS DRAWING                                   //
    // =========================================================================
    let isDetecting = false;

    async function detectFrame() {
      const now = performance.now();
      const delta = now - lastTime;
      lastTime = now;

      // Calculate instantaneous FPS
      frameTimes.push(1000 / (delta || 30));
      if (frameTimes.length > 15) frameTimes.shift();
      fps = Math.round(frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length);

      // Render FPS Indicator
      fpsCountEl.textContent = `${fps} FPS`;
      if (fps < 10) {
        fpsPill.className = "px-2.5 py-1 rounded-full bg-red-950/80 border border-red-500/50 text-red-400 text-xs font-mono font-bold flex items-center gap-1.5";
        lowFpsBanner.classList.remove("opacity-0", "-translate-y-4");
        lowFpsValue.textContent = fps;
      } else {
        fpsPill.className = "px-2.5 py-1 rounded-full bg-slate-800/80 border border-white/10 text-emerald-400 text-xs font-mono font-bold flex items-center gap-1.5";
        lowFpsBanner.classList.add("opacity-0", "-translate-y-4");
      }

      // Ensure canvas matches video frame resolution
      if (video.videoWidth && canvas.width !== video.videoWidth) {
        resizeCanvas();
      }

      // Clear canvas each frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Virtual Tripwire Line (Dashed Yellow Line)
      const tripwireY = canvas.height * tripwireRatioY;
      ctx.save();
      ctx.strokeStyle = "#F59E0B";
      ctx.lineWidth = 4;
      ctx.setLineDash([16, 10]);
      ctx.shadowColor = "#F59E0B";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0, tripwireY);
      ctx.lineTo(canvas.width, tripwireY);
      ctx.stroke();

      // Tripwire Badge Label
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#F59E0B";
      ctx.fillRect(16, tripwireY - 22, 175, 20);
      ctx.fillStyle = "#0B0F17";
      ctx.font = "bold 11px 'JetBrains Mono', monospace";
      ctx.fillText("COUNTING TRIPWIRE", 22, tripwireY - 8);
      ctx.restore();

      // Run AI Inference if model is ready and previous inference completed
      if (model && !isDetecting && video.readyState >= 2) {
        isDetecting = true;
        try {
          const predictions = await model.detect(video);

          // Filter only target vehicle categories
          for (const pred of predictions) {
            const classInfo = VEHICLE_CLASSES[pred.class.toLowerCase()];
            if (classInfo && pred.score >= 0.45) {
              const [x, y, w, h] = pred.bbox;
              const justCrossed = checkTripwireCrossing(pred.bbox, classInfo.key);

              // 1. Draw Glowing Bounding Box
              ctx.save();
              ctx.strokeStyle = justCrossed ? "#FFFFFF" : classInfo.color;
              ctx.lineWidth = justCrossed ? 5 : 3;
              ctx.shadowColor = justCrossed ? "#00D2FF" : classInfo.color;
              ctx.shadowBlur = justCrossed ? 25 : 10;
              ctx.strokeRect(x, y, w, h);

              // Subtle fill tint
              ctx.fillStyle = classInfo.color + (justCrossed ? "44" : "18");
              ctx.fillRect(x, y, w, h);

              // 2. HUD Corner Brackets
              const bLen = Math.min(w * 0.25, 16);
              ctx.strokeStyle = "#FFFFFF";
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.moveTo(x, y + bLen); ctx.lineTo(x, y); ctx.lineTo(x + bLen, y);
              ctx.moveTo(x + w - bLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + bLen);
              ctx.moveTo(x, y + h - bLen); ctx.lineTo(x, y + h); ctx.lineTo(x + bLen, y + h);
              ctx.moveTo(x + w - bLen, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - bLen);
              ctx.stroke();

              // 3. Confidence Badge Above Box
              const labelText = `${classInfo.label} ${(pred.score * 100).toFixed(0)}%`;
              ctx.font = "bold 12px 'JetBrains Mono', monospace";
              const textWidth = ctx.measureText(labelText).width;

              const badgeY = Math.max(y - 20, 4);
              ctx.fillStyle = classInfo.color;
              ctx.fillRect(x, badgeY, textWidth + 12, 19);

              ctx.fillStyle = "#0B0F17";
              ctx.fillText(labelText, x + 6, badgeY + 14);

              // 4. Center Dot for Tripwire Tracking
              ctx.fillStyle = "#FFFFFF";
              ctx.beginPath();
              ctx.arc(x + w / 2, y + h / 2, 4, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          }
        } catch (e) {
          console.error("Inference frame error:", e);
        } finally {
          isDetecting = false;
        }
      }

      requestAnimationFrame(detectFrame);
    }

    // =========================================================================
    // STEP 6: UI INTERACTIONS & EVENT HANDLERS                                 //
    // =========================================================================

    // Camera Switcher (Toggle between Environment and User Camera)
    document.getElementById("btnSwitchCamera").addEventListener("click", async () => {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      await startCamera();
    });

    // Manual Camera Permission Trigger (if blocked)
    document.getElementById("btnGrantCamManual").addEventListener("click", async () => {
      document.getElementById("btnGrantCamManual").classList.add("hidden");
      await startCamera();
    });

    // Torch / Flashlight Toggle (supported devices)
    document.getElementById("btnToggleTorch").addEventListener("click", async () => {
      if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
        try {
          torchActive = !torchActive;
          await videoTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
          document.getElementById("torchLabel").textContent = torchActive ? "Torch: ON" : "Torch";
          showToast(torchActive ? "🔦 Flashlight Enabled" : "🔦 Flashlight Off");
        } catch (e) {
          showToast("⚠️ Torch not supported on this lens");
        }
      } else {
        showToast("⚠️ Torch not available");
      }
    });

    // Reset Tripwire Line to Center
    document.getElementById("btnResetTripwire").addEventListener("click", () => {
      tripwireRatioY = 0.55;
      showToast("📏 Tripwire Centered at 55% Height");
    });

    // Reset Counts
    document.getElementById("btnResetCounts").addEventListener("click", () => {
      counts.total = 0;
      counts.bike = 0;
      counts.car = 0;
      counts.bus = 0;
      counts.truck = 0;
      trackedEntities.clear();
      updateMetricsUI();
      showToast("↺ Telemetry Counters Reset to 0");
    });

    // Export CSV Survey Data
    document.getElementById("btnExportCsv").addEventListener("click", () => {
      const timestamp = new Date().toISOString();
      const csvContent = "data:text/csv;charset=utf-8,"
        + "Metric,Count,Timestamp\n"
        + `Total Inbound Vehicles,${counts.total},${timestamp}\n`
        + `Two-Wheelers (Bikes),${counts.bike},${timestamp}\n`
        + `Cars & Cabs,${counts.car},${timestamp}\n`
        + `City Buses,${counts.bus},${timestamp}\n`
        + `Commercial Trucks,${counts.truck},${timestamp}\n`;

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `TrafficIQ_Survey_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("📥 Exported Survey CSV Report");
    });

    // =========================================================================
    // STEP 7: APPLICATION BOOTSTRAP                                            //
    // =========================================================================
    window.addEventListener("DOMContentLoaded", async () => {
      // 1. Start Camera
      await startCamera();
      // 2. Load Edge AI Model
      await loadEdgeAIModel();
      // 3. Start Inference & Render Loop
      requestAnimationFrame(detectFrame);
    });
  </script>
</body>
</html>
